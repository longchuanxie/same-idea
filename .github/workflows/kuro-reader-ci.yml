name: Kuro Reader CI

on:
  push:
    branches: [comics, main]
    paths:
      - 'reader/kuro-reader/**'
      - '.github/workflows/kuro-reader-ci.yml'
  pull_request:
    branches: [comics, main]
    paths:
      - 'reader/kuro-reader/**'
      - '.github/workflows/kuro-reader-ci.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: reader/kuro-reader
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: reader/kuro-reader/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
